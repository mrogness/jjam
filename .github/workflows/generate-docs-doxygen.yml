name: Generate Docs with Doxygen
on: 
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents:
    write

jobs:
  gen-docs:
    runs-on: ubuntu-latest
    steps:
      name: Generate Documentation with Doxygen
      uses: DenverCoder1/doxygen-github-pages-action@v2.0.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        config_file: doxrc
        target_folder: docs